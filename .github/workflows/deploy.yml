name: Deploy

on:
  push:
    branches: [main]
  # Verify runs on PRs too, so a broken build is caught before review rather
  # than at deploy time. The deploy job is gated to pushes on main.
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two concurrent releases racing the `current` symlink is
# the classic way to end up serving a half-swapped app.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  # Gate the deploy on the same checks that must pass locally. Cheap, and it
  # means a broken build never reaches the server.
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Guards
        run: node guards/run.mjs

      # `next build` peaked at 1.77 GB locally — comfortably inside a GitHub
      # runner, and the reason we build here rather than on a small VM.
      - name: Build
        run: pnpm build
        env:
          # Only needed to satisfy the module-level check in lib/db; no database
          # is contacted during the build.
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          BETTER_AUTH_SECRET: build-time-placeholder-not-used-at-runtime
          # Deliberately no NEXT_PUBLIC_APP_URL: the auth client is same-origin,
          # so the build carries no origin and the same artifact runs anywhere.

      # The standalone output keeps pnpm's symlinked node_modules and traces
      # PLATFORM-SPECIFIC binaries, so it must be built on Linux (as here) and
      # packed with tar, which preserves symlinks.
      - name: Assemble release bundle
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          tar -cf - -C .next/standalone . | tar -xf - -C "$STAGE"
          mkdir -p "$STAGE/.next/static"
          tar -cf - -C .next/static . | tar -xf - -C "$STAGE/.next/static"
          [ -d public ] && cp -R public "$STAGE/public"

          # drizzle-orm is bundled into the server chunks rather than traced
          # out, so the migration runner needs its own copy. It is pure JS.
          mkdir -p "$STAGE/node_modules"
          tar -cf - -C node_modules -h drizzle-orm | tar -xf - -C "$STAGE/node_modules"
          cp -R drizzle "$STAGE/drizzle"
          cp scripts/migrate.mjs "$STAGE/migrate.mjs"

          tar -czf release.tar.gz -C "$STAGE" .
          echo "bundle: $(du -h release.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: verify
    # Never deploy from a pull request — only merged/pushed main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Set up SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key so a hijacked DNS/IP cannot capture the deploy.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload release
        run: |
          set -euo pipefail
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            release.tar.gz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/release-$RELEASE_ID.tar.gz"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/release.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/release-$RELEASE_ID.sh"

      # release.sh migrates, swaps atomically, health-checks, and rolls back to
      # the previous release on failure — so a red step here means the old
      # version is still serving.
      - name: Release
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash /tmp/release-${RELEASE_ID}.sh '${RELEASE_ID}' '/tmp/release-${RELEASE_ID}.tar.gz' && rm -f /tmp/release-${RELEASE_ID}.sh"

      - name: Verify from the public edge
        run: |
          set -euo pipefail
          URL="${{ vars.PUBLIC_APP_URL || format('http://{0}', secrets.DEPLOY_HOST) }}"
          # -L follows redirects: once a domain with TLS is configured the edge
          # answers 308 on http://, which is correct behaviour and previously
          # failed this check even though the release was healthy.
          for i in $(seq 1 10); do
            code="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 10 "$URL/login" || true)"
            if [ "$code" = "200" ]; then echo "public health check OK ($URL)"; exit 0; fi
            echo "attempt $i: got $code"; sleep 3
          done
          echo "public health check failed for $URL" >&2
          exit 1
